services:
  - type: web
    name: scutta-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scutta-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '[]'
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "lax"
      - key: SESSION_TTL_DAYS
        value: "400"
      - key: SESSION_REFRESH_DAYS
        value: "7"
      - key: SESSION_MAX_PER_USER
        value: "5"
      - key: LOGIN_RATE_LIMIT_ATTEMPTS
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: SETTLEMENT_DRAWS
        value: '["중간고사 이후","종강총회"]'
      - key: SETTLEMENT_PRIZES
        value: '{"matches":"경기 수 부문 상품","wins":"승리 수 부문 상품","losses":"패배 수 부문 상품","opponents":"상대 수 부문 상품"}'

databases:
  - name: scutta-db
    plan: basic-256mb
    diskSizeGB: 1
    region: singapore
    postgresMajorVersion: "17"
    databaseName: scutta
    user: scutta
    ipAllowList: []
