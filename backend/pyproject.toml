[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scutta-api"
version = "0.1.0"
description = "탁구 동아리 경기 기록 API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.19.1,<2",
  "fastapi>=0.141.1,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pwdlib[argon2]>=0.3.1,<1",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0.52,<2.1",
  "tzdata>=2026.3",
  "uvicorn[standard]>=0.52.2,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
