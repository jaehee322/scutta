name: SCUTTA CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scutta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://scutta:scutta@localhost:5432/scutta_test
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scutta_test
          POSTGRES_USER: scutta
          POSTGRES_PASSWORD: scutta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scutta -d scutta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag scutta:test .
      - run: >-
          docker run --detach --name scutta-ci --publish 10000:10000
          --env ENVIRONMENT=production
          --env DATABASE_URL=sqlite:////tmp/scutta-ci.db
          --env CORS_ORIGINS=[]
          --env SESSION_COOKIE_SECURE=true
          --env SESSION_COOKIE_SAMESITE=lax
          scutta:test
      - name: Smoke test integrated app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:10000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/health | grep '"status":"ok"'
          curl --fail --silent --header 'Accept: text/html' http://127.0.0.1:10000/rankings | grep 'SCUTTA'
          test "$(curl --silent --output /tmp/api-body --write-out '%{http_code}' http://127.0.0.1:10000/api/v1/missing)" = "404"
          grep '"detail":"Not Found"' /tmp/api-body
      - if: always()
        run: |
          docker logs scutta-ci || true
          docker rm --force scutta-ci || true
